
<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Listado de salones</h2>

    <a routerLink="/rooms/create" class="btn btn-primary">
      Crear salón
    </a>
  </div>

  <div *ngIf="loading" class="alert alert-info">
    Cargando salones...
  </div>

  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <table *ngIf="!loading" class="table table-bordered table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Código</th>
        <th>Edificio</th>
        <th>Capacidad</th>
        <th>Disponibilidad</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let room of rooms">
        <td>{{ room.id }}</td>
        <td>{{ room.code }}</td>
        <td>{{ room.building }}</td>
        <td>{{ room.capacity }}</td>
        <td>
          {{ room.available ? 'Disponible' : 'No disponible' }}
        </td>

        <td>
          <a
            [routerLink]="['/rooms/detail', room.id]"
            class="btn btn-info btn-sm me-2">
            Ver
          </a>

          <a
            [routerLink]="['/rooms/update', room.id]"
            class="btn btn-warning btn-sm me-2">
            Editar
          </a>

          <button
            class="btn btn-danger btn-sm"
            (click)="deleteRoom(room.id)">
            Eliminar
          </button>
        </td>
      </tr>

      <tr *ngIf="rooms.length === 0">
        <td colspan="6" class="text-center">
          No hay salones registrados.
        </td>
      </tr>
    </tbody>
  </table>

</div>
